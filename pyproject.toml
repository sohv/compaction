[project]
name = "research-project"
version = "0.1.0"
description = "Research project scaffold"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "tqdm",
    "simple-parsing",
    "matplotlib",
    "seaborn",
    "wandb",
    "pyarrow>=25.0.1",
    "swebench>=5.0.2",
    "inspect-ai==0.3.271",
    "openai>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "ruff",
    "nbstripout",
]
llm = [
    "anthropic",
    "openai",
    "litellm",
    "python-dotenv",
]
# Add inference-stack extras per project as needed, e.g.:
# inference = ["vllm", "transformers", "accelerate", "torch"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "E402", "E741", "F841", "F403", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
